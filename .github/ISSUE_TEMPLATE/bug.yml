name: Bug report
description: Report a reproducible problem in the app
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: Describe the actual and expected behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 128, Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Safe sample data
      description: Use synthetic examples; remove names, contact details, credentials, and resume content.
